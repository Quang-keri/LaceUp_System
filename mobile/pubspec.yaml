name: mobile
description: "Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  intl: ^0.19.0
  top_snackbar_flutter: ^3.1.0
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.3
  flutter_dotenv: ^5.1.0
  dio: ^5.9.2
  curved_navigation_bar: ^1.0.6
  maplibre_gl: ^0.26.1
  geolocator: ^11.0.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/logo.png

